      - name: 협업지능 기반 로봇플러스 경쟁력 지원 (제조물류 자동화)
        summary: 이종 물류로봇(TETRA 대차·스태커·MiR) Open-RMF 통합, AGV–매니퓰레이터 TCP/IP 프로토콜, 도킹 제어권 핸드오버, PySide6 GUI.
        start_date: 2023-05
        end_date: 2025-05
