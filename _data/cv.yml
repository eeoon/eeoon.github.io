cv:
  name: Youngeon Kim (김영언)
  label: Mobile Robotics Engineer
  email: kye8456@naver.com
  location: Seoul, Korea
  website: https://eeoon.github.io
  summary: >
    Systems-integration, middleware, fleet-management and simulation engineer for manufacturing, logistics and service robotics.
    Designed and validated, from simulation to real robots, Open-RMF fleet management for heterogeneous multi-robot systems
    (30-robot simulation to 4 real robots), robot-to-elevator MQTT–ROS 2 integration, LiDAR-marker ICP precision docking,
    Docker/Git-based OTA deployment, learning-based multi-robot anomaly detection, and autonomous navigation on unstructured
    outdoor terrain. Three international conference papers (ICCAS), three domestic (KROC, ICROS), one patent.

  social_networks:
    - network: GitHub
      username: eeoon

  sections:
    Education:
      - institution: Keimyung University
        location: Daegu, Korea
        area: Robotics Engineering
        studyType: B.S.
        start_date: 2017-03
        end_date: 2023-02
        score: "GPA 4.2 / 4.5 (major 4.4 / 4.5)"
        highlights:
          - Capstone design award — four-legged wheel-leg hybrid robot (Mechathon)
          - Undergraduate researcher, Robot Dynamics and Intelligent Control Lab (2021.03 – 2022.01) — multi-DOF control system design, MFC-based actuator control

    Experience:
      - company: Korea Electronics Technology Institute (KETI), Intelligent Robotics Research Center
        position: Researcher · Mobile Robotics Engineer
        location: Seoul, Korea
        start_date: 2023-05
        end_date: present
        summary: Multi-robot fleet management · autonomous navigation · SDR/OTA · simulation · anomaly detection
        highlights:
          - "**Multi-robot fleet management and navigation:** Open-RMF-based supervisory control of heterogeneous robots — task allocation, collision avoidance, lane closure and real-time re-planning; ROS 2 service/action-based task hand-over; validated in a 30-robot simulation and deployed on 4 real robots; DDS/Zenoh communication tuning"
          - "**Middleware for heterogeneous system integration:** MQTT–ROS 2 bridge between robot and elevator (100% conversion success, 30–60 ms latency) enabling multi-floor autonomous navigation; custom TCP/IP protocol between AGV and manipulator for manufacturing logistics"
          - "**Precision docking and operational efficiency:** two-stage docking evolved from ArUco to 2D-LiDAR geometric markers to ICP registration, ±3–5 cm charging-dock accuracy on a real robot; simulation-based battery charging logic"
          - "**SDR OTA deployment framework:** Docker/Git container-level deployment with common code + robot-profile (YAML) parameter separation, so Navigation, Patrol, Elevator and Docking modules are swapped and verified without code changes (ICCAS 2025)"
          - "**Multi-robot anomaly detection and observability:** PySide6 fault-injection GUI and unified CSV logging; rule-based four-class anomaly detection with a web dashboard (ICCAS 2025), then Transformer self-supervised (RESTAD) learning-based detection (ICROS 2026, Aff-F1 0.94)"
          - "**Mobile-robot navigation pipeline:** mapping–localization–planning–control pipeline assembled from open-source components on simulation and real robots (TETRA_S, Jackal); outdoor stack with FAST-LIVO2 mapping, grid_map traversability and Pure Pursuit–LOS tracking"
          - "**Quadruped and biped platform simulation:** Unitree Go2 multi-floor (stairs, elevator) testbed across Gazebo Harmonic, Isaac Sim 5.0 and MuJoCo; locomotion policy porting with terrain-based switching; VLM-orchestrated autonomous mission agent"

      - company: Korea Institute of Robotics and Technology Convergence (KIRO), Robot Vocational Innovation Center
        position: Intern
        location: Gumi, Korea
        start_date: 2022-08
        end_date: 2023-03
        summary: Integrated training environment for heterogeneous industrial and collaborative robots
        highlights:
          - "Analyzed the control systems of **8+ robots** (Hyundai, FANUC, ABB, KUKA industrial arms; UR, Doosan, Neuromeka cobots), matched coordinate frames and communication specs per robot, and designed beginner/intermediate/advanced curricula and hands-on manuals"
          - "Ran the center's opening-ceremony demonstration with dozens of machines operating simultaneously without interference; designed cobot end-effector motions for stamping and signature events"

    Publications:
      - title: A Learning-based Anomaly Detection Framework for Multi-Robot Systems (first author)
        authors:
          - Youngeon Kim, Yohan Jung, Dong Yeop Kim, Keunhwan Kim
        publisher: Conference of the Institute of Control, Robotics and Systems (ICROS 2026)
        releaseDate: 2026-07
        summary: Transformer self-supervised (RESTAD) multi-robot time-series anomaly detection, region-level Aff-F1 0.94
      - title: Anomaly Detection and Visualization Framework for Multi-Robot Systems Using RMF (first author)
        authors:
          - Youngeon Kim, Yohan Jung, Dong Yeop Kim, Keunhwan Kim
        publisher: ICCAS 2025, pp. 808–811 (IEEE Xplore)
        releaseDate: 2025-11
        summary: Rule-based detection of four robot- and fleet-level anomaly types with a real-time web dashboard, validated with 30 simulated robots
      - title: Design and Implementation of an OTA Update Framework for Software-Defined Robots using ROS 2 and Docker (second author)
        authors:
          - Dong Yeop Kim, Youngeon Kim, Eunsu Kim, Keunhwan Kim, Euntai Kim, Deok Gyoon Chung
        publisher: ICCAS 2025, pp. 1994–1997 (IEEE Xplore)
        releaseDate: 2025-11
        summary: ROS 2 + Docker OTA framework for SDR with a public/on-premise dual-server architecture, proof-of-concept validation
      - title: Traversability Assessment and Path Planning Using Obstacle Recognition Information for Multi-Robot System (first author)
        authors:
          - YoungEon Kim, Dong Yeop Kim, Keunhwan Kim
        publisher: ICCAS 2024, pp. 1670–1671
        releaseDate: 2024-10
        summary: Proactive re-planning by deactivating edges whose obstacle count exceeds a threshold; cooperative vs. non-cooperative comparison with four robots
      - title: Method for Cross-Utilization of Obstacle Recognition Information in a Multi-Robot System for Collaborative Path Planning (first author, presenter)
        authors:
          - Youngeon Kim, Keunhwan Kim, Dong Yeop Kim
        publisher: Conference of the Institute of Control, Robotics and Systems (ICROS 2024)
        releaseDate: 2024-07
        summary: Obstacles from 2D LiDAR and RGB-D (YOLOv8) transformed into the global map frame and shared for collaborative path planning
      - title: Cooperative Autonomous Driving System for Multi-Mobile Robots Using Open-RMF (first author)
        authors:
          - Youngeon Kim, Keunhwan Kim, Dong Yeop Kim
        publisher: 19th Korea Robotics Society Annual Conference (KROC 2024), pp. 455–456
        releaseDate: 2024-02
        summary: Open-RMF + ROS Navigation server-client fleet management, real-robot cooperative driving validation

    Patents:
