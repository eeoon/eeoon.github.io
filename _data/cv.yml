      - name: English
        summary: "Technical reading and writing, international conference presentations"

    Projects:
      - name: Cooperative mapping, environment recognition and autonomous driving for multiple mobile robots in large-scale indoor workspaces
        summary: National R&D project. Open-RMF-based cooperative multi-robot navigation; 30-robot simulation, 4 real TETRA_S/M robots sim-to-real.
        start_date: 2023-05
        end_date: present
        highlights:
          - Open-RMF fleet and task system, namespace/TF design, sensor-fusion obstacle recognition and lane closure, MAPF analysis, fault injection and anomaly detection, yearly integration tests and certified testing
      - name: Business model development and robot implementation/validation for Software-Defined Robot (SDR) domain services
        summary: National R&D project. Elevator riding for multi-floor navigation, LiDAR-marker precision docking, GitHub + Docker OTA zero-downtime deployment, TRON1 biped and Go2 quadruped extensions.
        start_date: 2025-01
        end_date: present
        highlights:
          - MQTT–ROS 2 bridge and NavigateMultiFloor action, ICP docking ±3–5 cm, OTA robot-profile structure, Go2 three-simulator multi-floor testbed, VLM autonomous mission agent
      - name: Collaborative-intelligence-based Robot Plus competitiveness support (manufacturing logistics automation)
        summary: National R&D project. Heterogeneous logistics robots (TETRA carts, stacker AMR, MiR) integrated under Open-RMF, AGV–manipulator TCP/IP protocol, docking control hand-over, PySide6 GUI.
        start_date: 2023-05
        end_date: 2025-05
        highlights:
          - free_fleet modification and map alignment, stacker/ACS communication protocol design, YOLOv8 obstacle recognition demonstration, Isaac Sim integration study

    Interests:
      - name: Research Interests
        icon: fa-solid fa-tag
        keywords: "Multi-robot coordination, fleet-scale sim-to-real, LiDAR-inertial-visual odometry, traversability, legged robots in multi-floor buildings, VLM/VLA for embodied autonomy"
